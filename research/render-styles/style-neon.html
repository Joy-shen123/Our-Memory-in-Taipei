<!doctype html>
<html><head><meta charset="utf-8"><title>style: neon</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#070b1c}canvas{display:block}</style>
</head><body>
<script src="../../three.min.js"></script>
<script src="../../asset/3d/assets-core.js"></script>
<script src="../../asset/3d/assets-ximen-1980s.js"></script>
<script src="../../asset/3d/assets-ximen-1990s.js"></script>
<script src="../../asset/3d/assets-ximen-2000s.js"></script>
<script src="../../asset/3d/assets-dadaocheng-1980s.js"></script>
<script src="../../asset/3d/assets-dadaocheng-1990s.js"></script>
<script src="../../asset/3d/assets-dadaocheng-2000s.js"></script>
<script>
// neon — Night neon: dark blue night, glowing signs with bloom, warm street lamps, rain-wet road reflecting the lights.
// Same street/camera as print.html. Only SETUP (lights, ground, material swap) and POST (shader) differ.
(() => {
  const Q = new URLSearchParams(location.search);
  const SET = Q.get('set') || 'dadao';          // dadao | ximen | one | iso (a style may frame one street as a diorama)
  const STREET = Q.get('street') || (SET === 'iso' ? 'ximen' : SET);
  const ONE = Q.get('id');                       // with set=one: a single asset id
  const W = innerWidth, H = innerHeight;

  const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setSize(W, H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  let cam = new THREE.PerspectiveCamera(42, W / H, 0.5, 400);
  const lam = c => new THREE.MeshLambertMaterial({ color: c });
  const S = { treeDetail: 1, resScale: 1, rtFilter: THREE.LinearFilter };   // style hooks

  // ── SETUP: background, lights, page materials (ground/road/kerb/trees), S.override(mesh) ──

  scene.background = new THREE.Color('#070b1c');
  scene.add(new THREE.HemisphereLight('#2e3f8f', '#0b0a16', 0.55));
  const moon = new THREE.DirectionalLight('#7d93e0', 0.35); moon.position.set(8, 16, -10); scene.add(moon);
  for (let z = 6; z > -70; z -= 15) [-5.8, 5.8].forEach((x, i) => { const pl = new THREE.PointLight(i ? '#ffb46e' : '#ffc98a', 1.15, 28, 2); pl.position.set(x, 5.2, z + (i ? 7 : 0)); scene.add(pl); });
  const std = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, metalness: 0 });
  S.M = { ground: std('#15171f'), road: std('#0c0e16'), kerb: std('#3a3d48'), trunk: std('#1b1512'), leaf: std('#1f4a30') };
  // signs: any material the library made emissive glows hard enough to bloom
  S.override = o => { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
    if (m && m.emissive && m.emissive.getHex() !== 0) { m.emissiveIntensity = Math.max(1.6, m.emissiveIntensity * 3.5); }
  }); };

  const M = S.M;

  const REG = window.NOSTALGIA_ASSETS, Core = window.NostalgiaCore;
  const find = id => { for (const k in REG) { const a = REG[k].find(a => a.id === id); if (a) return a; } };
  const box = new THREE.Box3(), size = new THREE.Vector3();
  const build = id => { const a = find(id); if (!a) { console.warn('no asset', id); return null; } return a.build(Core); };

  // ground + road
  const ground = new THREE.Mesh(S.groundGeo ? S.groundGeo() : new THREE.PlaneGeometry(1200, 1200), M.ground);
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(13, 1200), M.road);
  road.rotation.x = -Math.PI / 2; road.position.y = 0.02; scene.add(road);
  [-6.6, 6.6].forEach(x => { const k = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 1200), M.kerb); k.position.set(x, 0.12, 0); scene.add(k); });

  // trees: trunk + leaf blobs
  function tree(x, z, s) {
    s = s || 1; const g = new THREE.Group();
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.28 * s, 4.2 * s, 6), M.trunk); t.position.y = 2.1 * s; g.add(t);
    [[0, 5.2, 0, 2.2], [1.4, 4.4, 0.3, 1.5], [-1.3, 4.6, -0.2, 1.6], [0.3, 6.4, 0.5, 1.4], [-0.6, 4.0, 1.2, 1.2]].forEach(([dx, dy, dz, r]) => {
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, S.treeDetail), M.leaf); m.position.set(dx * s, dy * s, dz * s); g.add(m);
    });
    g.position.set(x, 0, z); scene.add(g);
  }

  // place along the road, front facing the road, alternating sides
  function placeSide(obj, side, zc, scale) {
    if (scale) obj.scale.setScalar(scale);
    obj.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
    obj.updateMatrixWorld(true); box.setFromObject(obj); box.getSize(size);
    obj.position.set(side * (7.2 + size.x / 2), 0, zc); scene.add(obj); return size.z;
  }
  function street(ids, opts) {
    let zE = 12, zW = 8;
    ids.forEach((id, i) => {
      const obj = build(id); if (!obj) return;
      const side = i % 2 ? 1 : -1;
      obj.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; obj.updateMatrixWorld(true); box.setFromObject(obj); box.getSize(size);
      const depth = size.z; const zc = (side > 0 ? zE : zW) - depth / 2;
      placeSide(obj, side, zc);
      if (side > 0) zE -= depth + 2.5; else zW -= depth + 2.5;
    });
    if (opts.landmark) { const o = build(opts.landmark); if (o) { o.scale.setScalar(opts.landmarkScale || 2.2); o.updateMatrixWorld(true); box.setFromObject(o); box.getSize(size); o.position.set(0, 0, Math.min(zE, zW) - 6 - size.z / 2); scene.add(o); } }
    for (let z = 10; z > -80; z -= 11) { tree(-9.5, z + 3, 1.15); tree(9.5, z, 1.05); }
  }

  if (STREET === 'dadao') {
    street(['red-brick-arcade', 'baroque-gable-townhouse', 'dried-goods-shop', 'qipao-fabric-shop', 'nianhuo-stall', 'herbal-medicine-counter', 'new-year-market-stall', 'bolero-restaurant'], { landmark: 'xiahai-temple', landmarkScale: 2.4 });
    const s = build('sanlunche'); if (s) { s.position.set(-2.2, 0, -6); s.rotation.y = Math.PI; scene.add(s); }
    const t = build('blue-mini-truck'); if (t) { t.position.set(3, 0, -30); t.rotation.y = Math.PI; scene.add(t); }
    cam.position.set(0, 3.2, 22); cam.lookAt(0, 4, -40);
  } else if (STREET === 'ximen') {
    street(['chunghwa-market', 'movie-billboard-wall', 'record-shop', 'tower-records', 'comic-rental-shop', 'internet-cafe', 'manga-rental', 'phone-shop-window'], { landmark: 'red-house', landmarkScale: 2.0 });
    const b = build('yeh-lang-125'); if (b) { b.position.set(2, 0, -4); b.rotation.y = Math.PI * 0.9; scene.add(b); }
    const p = build('public-phone-booth'); if (p) { p.position.set(-5.6, 0, 2); scene.add(p); }
    cam.position.set(0, 3.2, 22); cam.lookAt(0, 4, -40);
  } else {
    const o = build(ONE || 'xiahai-temple'); if (o) { o.updateMatrixWorld(true); box.setFromObject(o); box.getSize(size); o.rotation.y = -0.5; scene.add(o);
      const d = Math.max(size.x, size.y, size.z); cam.position.set(d * 0.9, size.y * 0.55 + d * 0.25, d * 1.5); cam.lookAt(0, size.y * 0.45, 0); }
    tree(-9, -6, 1.1); tree(8, -9, 1.0);
  }
  if (S.camera) cam = S.camera(SET, cam) || cam;   // a style may move or replace the camera
  cam.updateMatrixWorld(true);

  // runtime material swap (models untouched on disk; only the built meshes get new materials)
  if (S.override) scene.traverse(o => { if (o.isMesh) S.override(o); });
  if (S.afterBuild) S.afterBuild();

  // ── POST: shared render target + fullscreen-quad helper ──
  const RW = Math.round(W * S.resScale), RH = Math.round(H * S.resScale);
  const rt = new THREE.WebGLRenderTarget(RW, RH, { depthBuffer: true, minFilter: S.rtFilter, magFilter: S.rtFilter });
  rt.depthTexture = new THREE.DepthTexture(RW, RH); rt.depthTexture.type = THREE.UnsignedIntType;
  const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const GLSL = `
    uniform sampler2D tDiffuse, tDepth; uniform vec2 uRes; uniform float uNear, uFar, uOrtho; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.0; a *= 0.5; } return v; }
    float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
    vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    float lin(float d){ if (uOrtho > 0.5) return uNear + d * (uFar - uNear); float z = d * 2.0 - 1.0; return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear)); }
    float rawDepth(vec2 uv){ return texture2D(tDepth, uv).x; }
    float depthAt(vec2 uv){ return lin(rawDepth(uv)); }
    // silhouettes + creases: 2nd derivative of linear depth, k = kernel radius in px. Flat planes give ~0.
    float depthEdge(vec2 uv, float k){ vec2 px = k / uRes; float d0 = depthAt(uv);
      float dd = abs(depthAt(uv - vec2(px.x, 0.0)) + depthAt(uv + vec2(px.x, 0.0)) - 2.0 * d0)
               + abs(depthAt(uv - vec2(0.0, px.y)) + depthAt(uv + vec2(0.0, px.y)) - 2.0 * d0);
      return dd / d0; }
    // painted detail (text, posters, colour changes on one surface)
    float lumEdge(vec2 uv, float k){ vec2 px = k / uRes; float l0 = lum(texture2D(tDiffuse, uv).rgb);
      return abs(l0 - lum(texture2D(tDiffuse, uv + vec2(px.x, 0.0)).rgb)) + abs(l0 - lum(texture2D(tDiffuse, uv - vec2(px.x, 0.0)).rgb))
           + abs(l0 - lum(texture2D(tDiffuse, uv + vec2(0.0, px.y)).rgb)) + abs(l0 - lum(texture2D(tDiffuse, uv - vec2(0.0, px.y)).rgb)); }
  `;
  const baseUniforms = () => ({ tDiffuse: { value: rt.texture }, tDepth: { value: rt.depthTexture }, uRes: { value: new THREE.Vector2(RW, RH) }, uNear: { value: cam.near }, uFar: { value: cam.far }, uOrtho: { value: cam.isOrthographicCamera ? 1 : 0 } });
  const quad = (frag, uniforms) => { const m = new THREE.ShaderMaterial({ uniforms, vertexShader: VS, fragmentShader: GLSL + frag, depthTest: false, depthWrite: false });
    const s = new THREE.Scene(); s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), m)); return { m, s, u: uniforms }; };
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const passes = [];   // every quad pass whose uRes must follow the render target size


  // bloom chain at quarter resolution: bright pass -> blur H -> blur V (x2)
  const BW = Math.round(RW / 4), BH = Math.round(RH / 4);
  const mk = () => new THREE.WebGLRenderTarget(BW, BH, { depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  const rtA = mk(), rtB = mk();
  const bright = quad(`
    uniform float uThresh;
    void main(){ vec2 px = 1.0 / uRes; vec3 c = vec3(0.0);
      c += texture2D(tDiffuse, vUv + px * vec2(-1.0, -1.0)).rgb; c += texture2D(tDiffuse, vUv + px * vec2(1.0, -1.0)).rgb;
      c += texture2D(tDiffuse, vUv + px * vec2(-1.0, 1.0)).rgb;  c += texture2D(tDiffuse, vUv + px * vec2(1.0, 1.0)).rgb; c *= 0.25;
      float k = smoothstep(uThresh, uThresh + 0.3, lum(c)); gl_FragColor = vec4(c * k, 1.0); }`,
    Object.assign(baseUniforms(), { uThresh: { value: 0.62 } }));
  passes.push(bright);
  const blur = quad(`
    uniform sampler2D tSrc; uniform vec2 uDir, uSrcRes;
    void main(){ vec2 px = uDir / uSrcRes; vec3 c = texture2D(tSrc, vUv).rgb * 0.227;
      float w[4]; w[0] = 0.194; w[1] = 0.121; w[2] = 0.054; w[3] = 0.016;
      for (int i = 1; i <= 4; i++) { float o = float(i) * 1.5; c += (texture2D(tSrc, vUv + px * o).rgb + texture2D(tSrc, vUv - px * o).rgb) * w[i - 1]; }
      gl_FragColor = vec4(c, 1.0); }`,
    Object.assign(baseUniforms(), { tSrc: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uSrcRes: { value: new THREE.Vector2(BW, BH) } }));
  const P = quad(`
    uniform sampler2D tBloom; uniform mat4 uProj, uInvProj, uView, uInvView;
    vec3 viewPos(vec2 uv){ float z = rawDepth(uv) * 2.0 - 1.0; vec4 p = uInvProj * vec4(uv * 2.0 - 1.0, z, 1.0); return p.xyz / p.w; }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb; float raw = rawDepth(vUv); float d0 = lin(raw); bool isSky = raw > 0.9999;
      vec2 p = gl_FragCoord.xy;
      // night sky: navy gradient, a little city glow at the horizon, sparse stars
      float t = clamp((vUv.y - 0.45) / 0.55, 0.0, 1.0);
      vec3 sky = mix(vec3(0.16, 0.11, 0.30), vec3(0.01, 0.02, 0.07), pow(t, 0.7));
      vec2 sp = floor(p / 2.0); float star = step(0.9965, hash(sp)) * smoothstep(0.5, 0.75, vUv.y) * (0.4 + 0.6 * hash(sp + 3.0));
      sky += star * 0.9;
      vec3 col = isSky ? sky : c;
      // wet road: screen-space reflection on ground pixels, masked by puddles
      if (!isSky) {
        vec3 vp = viewPos(vUv); vec3 wp = (uInvView * vec4(vp, 1.0)).xyz;
        if (wp.y < 0.3 && d0 < 170.0) {
          vec3 vdir = normalize(mat3(uInvView) * normalize(vp));
          vec3 rdir = reflect(vdir, vec3(0.0, 1.0, 0.0));
          vec3 refl = vec3(0.0); float hit = 0.0; float stepLen = 0.3; vec3 q = wp;
          for (int i = 0; i < 48; i++) {
            stepLen *= 1.07; q += rdir * stepLen;
            vec4 qv = uView * vec4(q, 1.0); vec4 qc = uProj * qv; vec2 qs = qc.xy / qc.w * 0.5 + 0.5;
            if (qs.x < 0.0 || qs.x > 1.0 || qs.y > 1.0 || qs.y < 0.0) break;
            float sceneZ = depthAt(qs); float rayZ = -qv.z;
            if (sceneZ < rayZ - 0.02 && sceneZ > rayZ - (2.0 + stepLen * 2.5)) {
              refl = texture2D(tDiffuse, qs).rgb + texture2D(tBloom, qs).rgb * 0.9;
              hit = smoothstep(0.0, 0.08, qs.x) * smoothstep(1.0, 0.92, qs.x) * smoothstep(1.0, 0.96, qs.y); break; }
          }
          if (hit < 0.01) { refl = sky * 0.9; hit = 0.7; }
          float puddle = smoothstep(0.44, 0.66, fbm(wp.xz * 0.11 + 5.0));
          float wet = (0.10 + 0.62 * puddle) * (abs(wp.x) < 6.8 ? 1.0 : 0.45);   // pavement less glossy than the road
          float fres = pow(1.0 - clamp(dot(-vdir, vec3(0.0, 1.0, 0.0)), 0.0, 1.0), 1.5) * 0.7 + 0.3;
          // ripple: break the reflection a little
          float rip = 1.0 - (noise(wp.xz * vec2(3.0, 9.0)) - 0.5) * 0.45;
          col = mix(col, refl * rip, clamp(wet * fres * hit, 0.0, 0.9));
        }
      }
      col += texture2D(tBloom, vUv).rgb * 1.25;
      // grade: cool shadows, keep highlights warm
      col = mix(col, col * vec3(0.8, 0.88, 1.2), 0.45 * (1.0 - smoothstep(0.0, 0.5, lum(col))));
      col = col / (1.0 + col * 0.15);   // soft shoulder so bloom does not clip white
      float v = distance(vUv, vec2(0.5)); col *= 1.0 - smoothstep(0.45, 0.95, v) * 0.35;
      gl_FragColor = vec4(col, 1.0);
    }`, Object.assign(baseUniforms(), { tBloom: { value: rtA.texture }, uProj: { value: cam.projectionMatrix }, uInvProj: { value: cam.projectionMatrixInverse },
      uView: { value: cam.matrixWorldInverse }, uInvView: { value: cam.matrixWorld } }));
  passes.push(P);
  function frame() {
    renderer.setRenderTarget(rt); renderer.render(scene, cam);
    renderer.setRenderTarget(rtA); renderer.render(bright.s, postCam);
    for (let i = 0; i < 2; i++) {
      blur.u.tSrc.value = rtA.texture; blur.u.uDir.value.set(1, 0); renderer.setRenderTarget(rtB); renderer.render(blur.s, postCam);
      blur.u.tSrc.value = rtB.texture; blur.u.uDir.value.set(0, 1); renderer.setRenderTarget(rtA); renderer.render(blur.s, postCam);
    }
    renderer.setRenderTarget(null); renderer.render(P.s, postCam);
    requestAnimationFrame(frame);
  }
  S.onResize = (w, h) => { rtA.setSize(Math.round(w / 4), Math.round(h / 4)); rtB.setSize(Math.round(w / 4), Math.round(h / 4)); blur.u.uSrcRes.value.set(Math.round(w / 4), Math.round(h / 4)); };


  addEventListener('resize', () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix();
    if (S.resScale === 1) { rt.setSize(w, h); passes.forEach(p => p.u.uRes.value.set(w, h)); } if (S.onResize) S.onResize(w, h); });
  frame();
  window.__S = S; window.__scene = scene; window.__cam = cam; window.__ready = true;
})();
</script>
</body></html>
