<html><head><meta charset="utf-8"><title>style: bruno</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9b89ff}canvas{display:block}</style>
</head><body>
<script src="../../three.min.js"></script>
<script src="../../asset/3d/assets-core.js"></script>
<script src="../../asset/3d/assets-ximen-1980s.js"></script>
<script src="../../asset/3d/assets-ximen-1990s.js"></script>
<script src="../../asset/3d/assets-ximen-2000s.js"></script>
<script src="../../asset/3d/assets-dadaocheng-1980s.js"></script>
<script src="../../asset/3d/assets-dadaocheng-1990s.js"></script>
<script src="../../asset/3d/assets-dadaocheng-2000s.js"></script>
<script>
// bruno — our street rendered with bruno-simon.com's method (folio-2025, see research/bruno-simon/README.md §4 and §6):
//   1. one sun, and every shadow (core shadow = smoothstep(-0.25, 1, n·l), drop shadow = 2048 shadow map) mixes the colour toward base × a saturated purple, never grey
//   2. every model colour snapped to Bruno's 24-swatch palette (sign lettering canvases kept)
//   3. no detail maps, flat colour, and a fake ground bounce on downward-facing surfaces
//   4. 25 degree field of view, camera pulled back along the same line of sight
//   5. four day-cycle presets: light colour + intensity, shadow colour, sky = 2D gradient between fog A and fog B, objects fade to the same colours
// Options: ?set=dadao|ximen  ?palette=bruno|tw80 (default bruno)  ?cycle=day|dusk|night|dawn (default day)  ?step=1 (ingredient 1 only, for the before/after shot)  ?dof=1 (Bruno's screen-Y blur, off by default)  ?bloom=0
// Same street/camera code as print.html. Only SETUP (lights, materials, camera) and POST (shader) differ.
(() => {
  const Q = new URLSearchParams(location.search);
  const SET = Q.get('set') || 'dadao';          // dadao | ximen | one | iso (a style may frame one street as a diorama)
  const STREET = Q.get('street') || (SET === 'iso' ? 'ximen' : SET);
  const ONE = Q.get('id');                       // with set=one: a single asset id
  const W = innerWidth, H = innerHeight;

  const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setSize(W, H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  let cam = new THREE.PerspectiveCamera(42, W / H, 0.5, 400);
  const lam = c => new THREE.MeshLambertMaterial({ color: c });
  const S = { treeDetail: 1, resScale: 1, rtFilter: THREE.LinearFilter };   // style hooks
  // Like Bruno's renderer, the maths runs in linear light: every hex colour is decoded to linear by hand (r149's own colour management only covers setHex), the last pass encodes to sRGB.
  const L = h => new THREE.Color(h).convertSRGBToLinear();

  // ── SETUP: background, lights, page materials (ground/road/kerb/trees), S.override(mesh) ──

  const STEP = Q.get('step') === '1' ? 1 : 5;          // 1 = coloured shadows only; 5 = all five ingredients
  const CYCLE_NAME = ['day', 'dusk', 'night', 'dawn'].includes(Q.get('cycle')) ? Q.get('cycle') : 'day';
  const DOF = Q.get('dof') === '1';
  const BLOOM = STEP === 5 && Q.get('bloom') !== '0';
  // §6b: the four day-cycle presets, hex for hex
  const CYCLES = {
    day:   { light: '#ffd2c2', intensity: 1.2, shadow: '#6d3fff', fogA: '#00ffff', fogB: '#9b89ff' },
    dusk:  { light: '#ff8181', intensity: 1.2, shadow: '#4e009c', fogA: '#3e53ff', fogB: '#ff4ce4' },
    night: { light: '#3240ff', intensity: 3.8, shadow: '#2f00db', fogA: '#10266f', fogB: '#490a42' },
    dawn:  { light: '#ffa882', intensity: 1.2, shadow: '#db004f', fogA: '#f885ff', fogB: '#ff7d24' },
  };
  const CY = CYCLES[CYCLE_NAME];
  // TW80-START — name, hex; every hex traced to a web source in README row 15 (4 research passes, 2026-09-23)
  const TW80 = [
    ['二丁掛 tan tile', '#d0b084'], ['二丁掛 brown tile', '#6f4e37'], ['磨石子 terrazzo grey', '#b9b7ae'], ['磨石子 terrazzo green-grey', '#738678'],
    ['紅磚 red brick', '#a8503f'], ['紅瓦 roof tile', '#a84a3b'], ['米黃牆 cream plaster', '#ede2c0'], ['柏油 asphalt', '#6f6e63'],
    ['鐵窗花 grille green', '#5e8c6a'], ['鐵窗花 rust red', '#8a3b2b'], ['藍白拖 slipper blue', '#2b4fa8'], ['藍白拖 sole white', '#f0eee6'],
    ['大同 Tatung green', '#8fbf92'], ['鐵皮 tin-roof blue', '#79afcb'], ['可口可樂 Coke red', '#f40009'], ['黑松 HeySong red', '#e40014'],
    ['老磁磚 tile pink', '#e3acae'], ['老磁磚 tile mint', '#bee0ce'], ['柑仔店 wood light', '#926942'], ['柑仔店 wood dark', '#694d36'],
    ['霓虹 neon pink', '#ff6ec7'], ['霓虹 neon cyan', '#04d9ff'], ['招牌 sign yellow', '#ffc800'], ['夜招牌 night navy', '#0b1026'],
  ];
  // TW80-END
  // ?palette=bruno (default): §6a, Bruno's 24 palette bands plus black.  ?palette=tw80: 24 Taiwan-1980s swatches plus black (CJ, 2026-09-23: 「i want the color pallete be taiwan 80s retro」), sources in README row 15.
  const PALETTES = {
    bruno: { hexes: ['#7c7691', '#ebd1a3', '#574e37', '#3dbbe7', '#c8c2c1', '#4a413c', '#575a5e', '#eec3af', '#e4a90c', '#91ad78', '#e49a78', '#988165',
      '#abae2b', '#a49876', '#b36d45', '#e56202', '#ec3f1c', '#fde6e1', '#f8a658', '#c30e3a', '#c366ef', '#ed719f', '#1e0603', '#fff2e8', '#000000'],
      furniture: { ground: '#abae2b', road: '#c8c2c1', kerb: '#ebd1a3', trunk: '#988165', leaf: '#91ad78' } },
    tw80: { hexes: TW80.map(x => x[1]).concat(['#000000']),
      furniture: { ground: '#b9b7ae', road: '#6f6e63', kerb: '#ede2c0', trunk: '#694d36', leaf: '#5e8c6a' } },   // terrazzo pavement, asphalt, cream kerb, dark shop wood, grille green
  };
  const PAL_NAME = PALETTES[Q.get('palette')] ? Q.get('palette') : 'bruno';
  const HEXES = PALETTES[PAL_NAME].hexes, FURN = PALETTES[PAL_NAME].furniture;
  // Bruno assigns swatches by hand in Blender; our stand-in is the nearest swatch in Oklab with hue and saturation weighted 2.5x over lightness
  // (light and shadow will move the lightness anyway, and a plain nearest-colour rule turned the Red House's brick red into dark olive).
  const oklab = c => { const l = Math.cbrt(0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b), m = Math.cbrt(0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b), s = Math.cbrt(0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s]; };
  const PALETTE = HEXES.map(h => { const lin = L(h); return { lin, lab: oklab(lin), hex: h.slice(1) }; });
  const snaps = window.__snaps = [];
  const snap = cs => {   // cs is the material's sRGB colour; returns the swatch in linear
    const q = oklab(cs.clone().convertSRGBToLinear()); let best = PALETTE[0], bd = 1e9;
    for (const p of PALETTE) { const dL = q[0] - p.lab[0], da = (q[1] - p.lab[1]) * 2.5, db = (q[2] - p.lab[2]) * 2.5; const d = dL * dL + da * da + db * db; if (d < bd) { bd = d; best = p; } }
    snaps.push('#' + cs.getHexString() + ' -> #' + best.hex); return best.lin.clone();
  };

  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
  scene.background = L(STEP === 1 ? '#9fd3ff' : CY.fogB);
  // the one real light. Its colour/intensity are not used by the shader below; only its direction and its shadow map are.
  const sun = new THREE.DirectionalLight('#ffffff', 1.0); sun.target.position.set(0, 0, -40);
  sun.position.setFromSpherical(new THREE.Spherical(80, 0.63, 0.72)).add(sun.target.position); scene.add(sun, sun.target);   // his Ligthing.js: phi 0.63, theta 0.72
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.001; sun.shadow.normalBias = 0.1; sun.shadow.radius = 3;
  const sc = sun.shadow.camera; sc.left = -80; sc.right = 80; sc.top = 80; sc.bottom = -80; sc.near = 1; sc.far = 200;
  S.treeDetail = 0;

  // shared uniforms every Bruno material reads
  const U = {
    uLightColor: { value: L(CY.light) }, uLightIntensity: { value: CY.intensity }, uShadowColor: { value: L(CY.shadow) },
    uBounceRoad: { value: L(FURN.road) }, uBounceGround: { value: L(FURN.ground) }, uBounce: { value: STEP === 5 ? 1.0 : 0.0 },
  };
  // MeshDefaultMaterial in r149 terms: a MeshLambertMaterial whose lighting block is replaced. Three.js still builds the shadow map and
  // vDirectionalShadowCoord for us; we call getShadow() ourselves so the shadow becomes a number we colour, instead of a darkening.
  const inject = m => {
    m.onBeforeCompile = sh => {
      Object.assign(sh.uniforms, U);
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWorldPos;')
        .replace('#include <project_vertex>', '#include <project_vertex>\nvWorldPos = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('uniform vec3 diffuse;',
        'uniform vec3 diffuse; uniform vec3 uLightColor; uniform float uLightIntensity; uniform vec3 uShadowColor; uniform vec3 uBounceRoad; uniform vec3 uBounceGround; uniform float uBounce; varying vec3 vWorldPos;')
        .replace('#include <lights_fragment_begin>', `{
          vec3 base = diffuseColor.rgb;
          // 3. fake ground bounce: downward-facing surfaces pick up the road or ground colour, fading with height
          vec3 nW = inverseTransformDirection( normal, viewMatrix );
          vec3 bounceCol = abs( vWorldPos.x ) < 6.6 ? uBounceRoad : uBounceGround;
          float bounceO = smoothstep( -1.0, 1.0, dot( nW, vec3( 0.0, -1.0, 0.0 ) ) );
          float bounceD = pow( max( ( 2.5 - max( 0.0, vWorldPos.y ) ) / 2.5, 0.0 ), 2.0 );
          base = mix( base, bounceCol, bounceO * bounceD * 1.0 * uBounce );
          // 1. core shadow (two soft bands) and drop shadow (the map), combined by max, both coloured
          float core = 1.0, drop = 1.0;
          #if NUM_DIR_LIGHTS > 0
            core = smoothstep( -0.25, 1.0, dot( normal, directionalLights[ 0 ].direction ) );
            #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
              drop = receiveShadow ? getShadow( directionalShadowMap[ 0 ], directionalLightShadows[ 0 ].shadowMapSize, directionalLightShadows[ 0 ].shadowBias, directionalLightShadows[ 0 ].shadowRadius, vDirectionalShadowCoord[ 0 ] ) : 1.0;
            #endif
          #endif
          float sh = max( 1.0 - core, 1.0 - drop );
          vec3 lit = base * uLightColor * uLightIntensity;
          reflectedLight.directDiffuse = mix( lit, base * uShadowColor, sh );
        }`)
        .replace('#include <lights_fragment_end>', '');
    };
    m.customProgramCacheKey = () => 'bruno';
    return m;
  };
  const bm = (c, o) => inject(new THREE.MeshLambertMaterial(Object.assign({ color: c, flatShading: true }, o || {})));
  const own = m => { m.userData.keep = true; return m; };   // page furniture is already linear + palette: conv leaves it alone
  // page furniture from the palette: grass olive, light-grey paving, sand kerb, mid-brown trunk, sage leaves
  S.M = { ground: own(bm(L(FURN.ground))), road: own(bm(L(FURN.road))), kerb: own(bm(L(FURN.kerb))), trunk: own(bm(L(FURN.trunk))), leaf: own(bm(L(FURN.leaf))) };
  const cache = new Map();
  const conv = m => {
    if (m && m.map && m.map.encoding !== THREE.sRGBEncoding) { m.map.encoding = THREE.sRGBEncoding; m.map.needsUpdate = true; }
    if (!m || m.isShaderMaterial || m.isMeshBasicMaterial || (m.userData && m.userData.keep)) return m;              // sign lettering keeps its own canvas, unlit, as Bruno keeps his labels
    if (cache.has(m.uuid)) return cache.get(m.uuid);
    const col = (STEP === 5 && !m.map) ? snap(m.color) : m.color.clone().convertSRGBToLinear();           // 2. palette
    const t = bm(col, { map: m.map || null, transparent: m.transparent, opacity: m.opacity, side: m.side, alphaTest: m.alphaTest,
      emissive: m.emissive ? m.emissive.clone().convertSRGBToLinear() : new THREE.Color(0), emissiveIntensity: m.emissiveIntensity !== undefined ? m.emissiveIntensity : 1 });
    cache.set(m.uuid, t); return t;
  };
  const flags = o => { const m0 = Array.isArray(o.material) ? o.material[0] : o.material; o.castShadow = !(m0 && m0.transparent); o.receiveShadow = true; };
  S.override = o => { o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material); flags(o); };
  // 4. narrow camera: 25 degrees, pulled back along the same line of sight so the far end frames the same
  let camMoved = 0;
  S.camera = (set, c) => {
    if (STEP === 1 || (set !== 'dadao' && set !== 'ximen')) return c;
    const target = new THREE.Vector3(0, 4, -40), from = c.position.clone();
    const k = Math.tan(THREE.MathUtils.degToRad(42 / 2)) / Math.tan(THREE.MathUtils.degToRad(25 / 2));
    c.position.copy(target).add(from.sub(target).multiplyScalar(k)); c.fov = 25; c.updateProjectionMatrix(); c.lookAt(target);
    camMoved = c.position.z - 22; return c;
  };
  S.afterBuild = () => {
    scene.traverse(o => { if (o.isMesh) flags(o); });
  };

  const M = S.M;

  const REG = window.NOSTALGIA_ASSETS, Core = window.NostalgiaCore;
  const find = id => { for (const k in REG) { const a = REG[k].find(a => a.id === id); if (a) return a; } };
  const box = new THREE.Box3(), size = new THREE.Vector3();
  const build = id => { const a = find(id); if (!a) { console.warn('no asset', id); return null; } return a.build(Core); };

  // ground + road
  const ground = new THREE.Mesh(S.groundGeo ? S.groundGeo() : new THREE.PlaneGeometry(1200, 1200), M.ground);
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(13, 1200), M.road);
  road.rotation.x = -Math.PI / 2; road.position.y = 0.02; scene.add(road);
  [-6.6, 6.6].forEach(x => { const k = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 1200), M.kerb); k.position.set(x, 0.12, 0); scene.add(k); });

  // trees: trunk + leaf blobs
  function tree(x, z, s) {
    s = s || 1; const g = new THREE.Group();
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.28 * s, 4.2 * s, 6), M.trunk); t.position.y = 2.1 * s; g.add(t);
    [[0, 5.2, 0, 2.2], [1.4, 4.4, 0.3, 1.5], [-1.3, 4.6, -0.2, 1.6], [0.3, 6.4, 0.5, 1.4], [-0.6, 4.0, 1.2, 1.2]].forEach(([dx, dy, dz, r]) => {
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, S.treeDetail), M.leaf); m.position.set(dx * s, dy * s, dz * s); g.add(m);
    });
    g.position.set(x, 0, z); scene.add(g);
  }

  // place along the road, front facing the road, alternating sides
  function placeSide(obj, side, zc, scale) {
    if (scale) obj.scale.setScalar(scale);
    obj.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
    obj.updateMatrixWorld(true); box.setFromObject(obj); box.getSize(size);
    obj.position.set(side * (7.2 + size.x / 2), 0, zc); scene.add(obj); return size.z;
  }
  function street(ids, opts) {
    let zE = 12, zW = 8;
    ids.forEach((id, i) => {
      const obj = build(id); if (!obj) return;
      const side = i % 2 ? 1 : -1;
      obj.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; obj.updateMatrixWorld(true); box.setFromObject(obj); box.getSize(size);
      const depth = size.z; const zc = (side > 0 ? zE : zW) - depth / 2;
      placeSide(obj, side, zc);
      if (side > 0) zE -= depth + 2.5; else zW -= depth + 2.5;
    });
    if (opts.landmark) { const o = build(opts.landmark); if (o) { o.scale.setScalar(opts.landmarkScale || 2.2); o.updateMatrixWorld(true); box.setFromObject(o); box.getSize(size); o.position.set(0, 0, Math.min(zE, zW) - 6 - size.z / 2); scene.add(o); } }
    for (let z = 10; z > -80; z -= 11) { tree(-9.5, z + 3, 1.15); tree(9.5, z, 1.05); }
  }

  if (STREET === 'dadao') {
    street(['red-brick-arcade', 'baroque-gable-townhouse', 'dried-goods-shop', 'qipao-fabric-shop', 'nianhuo-stall', 'herbal-medicine-counter', 'new-year-market-stall', 'bolero-restaurant'], { landmark: 'xiahai-temple', landmarkScale: 2.4 });
    const s = build('sanlunche'); if (s) { s.position.set(-2.2, 0, -6); s.rotation.y = Math.PI; scene.add(s); }
    const t = build('blue-mini-truck'); if (t) { t.position.set(3, 0, -30); t.rotation.y = Math.PI; scene.add(t); }
    cam.position.set(0, 3.2, 22); cam.lookAt(0, 4, -40);
  } else if (STREET === 'ximen') {
    street(['chunghwa-market', 'movie-billboard-wall', 'record-shop', 'tower-records', 'comic-rental-shop', 'internet-cafe', 'manga-rental', 'phone-shop-window'], { landmark: 'red-house', landmarkScale: 2.0 });
    const b = build('yeh-lang-125'); if (b) { b.position.set(2, 0, -4); b.rotation.y = Math.PI * 0.9; scene.add(b); }
    const p = build('public-phone-booth'); if (p) { p.position.set(-5.6, 0, 2); scene.add(p); }
    cam.position.set(0, 3.2, 22); cam.lookAt(0, 4, -40);
  } else {
    const o = build(ONE || 'xiahai-temple'); if (o) { o.updateMatrixWorld(true); box.setFromObject(o); box.getSize(size); o.rotation.y = -0.5; scene.add(o);
      const d = Math.max(size.x, size.y, size.z); cam.position.set(d * 0.9, size.y * 0.55 + d * 0.25, d * 1.5); cam.lookAt(0, size.y * 0.45, 0); }
    tree(-9, -6, 1.1); tree(8, -9, 1.0);
  }
  if (S.camera) cam = S.camera(SET, cam) || cam;   // a style may move or replace the camera
  cam.updateMatrixWorld(true);

  // runtime material swap (models untouched on disk; only the built meshes get new materials)
  if (S.override) scene.traverse(o => { if (o.isMesh) S.override(o); });
  if (S.afterBuild) S.afterBuild();

  // ── POST: shared render target + fullscreen-quad helper ──
  const RW = Math.round(W * S.resScale), RH = Math.round(H * S.resScale);
  const rt = new THREE.WebGLRenderTarget(RW, RH, { depthBuffer: true, minFilter: S.rtFilter, magFilter: S.rtFilter, type: THREE.HalfFloatType });   // HDR so emissive > 1 survives for the bloom threshold
  rt.depthTexture = new THREE.DepthTexture(RW, RH); rt.depthTexture.type = THREE.UnsignedIntType;
  const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const GLSL = `
    uniform sampler2D tDiffuse, tDepth; uniform vec2 uRes; uniform float uNear, uFar, uOrtho; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
    float lin(float d){ if (uOrtho > 0.5) return uNear + d * (uFar - uNear); float z = d * 2.0 - 1.0; return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear)); }
    float rawDepth(vec2 uv){ return texture2D(tDepth, uv).x; }
    float depthAt(vec2 uv){ return lin(rawDepth(uv)); }
  `;
  const baseUniforms = () => ({ tDiffuse: { value: rt.texture }, tDepth: { value: rt.depthTexture }, uRes: { value: new THREE.Vector2(RW, RH) }, uNear: { value: cam.near }, uFar: { value: cam.far }, uOrtho: { value: cam.isOrthographicCamera ? 1 : 0 } });
  const quad = (frag, uniforms) => { const m = new THREE.ShaderMaterial({ uniforms, vertexShader: VS, fragmentShader: GLSL + frag, depthTest: false, depthWrite: false });
    const s = new THREE.Scene(); s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), m)); return { m, s, u: uniforms }; };
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const passes = [];   // every quad pass whose uRes must follow the render target size

  // weak bloom, Bruno's numbers: threshold 1, strength 0.25. Quarter-size bright pass, then a separable blur. Only emissive things (lit signs, neon) pass the threshold.
  const BW = Math.round(RW / 4), BH = Math.round(RH / 4);
  const mkRT = () => new THREE.WebGLRenderTarget(BW, BH, { depthBuffer: false, type: THREE.HalfFloatType });
  const bA = mkRT(), bB = mkRT();
  const Bright = quad(`void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float l = lum(c); float w = max(l - 1.0, 0.0) / max(l, 1e-4); gl_FragColor = vec4(c * w, 1.0); }`, baseUniforms());
  const blurFrag = `uniform sampler2D tSrc; uniform vec2 uDir;
    void main(){ vec3 s = vec3(0.0); float ws[7]; ws[0]=0.199; ws[1]=0.176; ws[2]=0.121; ws[3]=0.065; ws[4]=0.027; ws[5]=0.009; ws[6]=0.002;
      s += texture2D(tSrc, vUv).rgb * ws[0];
      for (int i = 1; i < 7; i++) { vec2 o = uDir * float(i) * 1.5 / vec2(${BW}.0, ${BH}.0); s += (texture2D(tSrc, vUv + o).rgb + texture2D(tSrc, vUv - o).rgb) * ws[i]; }
      gl_FragColor = vec4(s, 1.0); }`;
  const BlurH = quad(blurFrag, Object.assign(baseUniforms(), { tSrc: { value: bA.texture }, uDir: { value: new THREE.Vector2(1, 0) } }));
  const BlurV = quad(blurFrag, Object.assign(baseUniforms(), { tSrc: { value: bB.texture }, uDir: { value: new THREE.Vector2(0, 1) } }));

  // 5. sky = 2D gradient between fog A (top) and fog B (horizon), no skybox; objects fade toward the sky colour behind them with distance
  const P = quad(`
    uniform vec3 uFogA, uFogB; uniform sampler2D tBloom; uniform float uBloom, uFog;
    vec3 sky(vec2 uv){ vec2 asp = vec2(uRes.x / uRes.y, 1.0);
      float r = smoothstep(0.0, 0.9, distance(uv * asp, vec2(0.5 * asp.x, 0.53)));   // his Fog.js: A and B mixed by screen distance from a radial centre; ours sits on the vanishing point
      return mix(uFogA, uFogB, r); }
    vec3 toSRGB(vec3 c){ return mix(pow(c, vec3(1.0 / 2.4)) * 1.055 - 0.055, c * 12.92, step(c, vec3(0.0031308))); }
    void main(){
