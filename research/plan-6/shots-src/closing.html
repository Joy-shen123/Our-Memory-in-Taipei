<!doctype html>
<html><head><meta charset="utf-8"><title>closing words</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #2b2f3a; color: #f7f2e8; font-family: -apple-system, "PingFang TC", "Helvetica Neue", sans-serif; }
.frame { position: relative; width: 1440px; height: 900px; overflow: hidden; }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mask { position: absolute; top: calc(24vh - 20px); left: 0; width: 640px; height: 260px; background: linear-gradient(100deg, rgba(43,47,58,0.94) 60%, rgba(43,47,58,0.5)); }
.hud-closing { position: absolute; top: 24vh; left: 56px; max-width: 560px; font-size: 34px; font-weight: 600; line-height: 1.28; letter-spacing: -0.01em; text-shadow: 0 2px 24px #2b2f3a, 0 2px 24px #2b2f3a; }
.hud-closing .old { opacity: 0.55; font-size: 0.7em; display: block; margin-bottom: 10px; }
.tag { position: absolute; top: 20px; left: 20px; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; background: rgba(43,47,58,0.75); padding: 6px 12px; border-radius: 4px; }
</style>
</head>
<body>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'a';
  document.write(v === 'b' ?
    `<div class="frame" id="B">
      <img src="closing-bg.png">
      <div class="mask"></div>
      <div class="tag">Version B — follows, second beat</div>
      <div class="hud-closing">
        <span class="old">Where we go, we don't know. We only know we need to climb higher.</span>
        Just like the man on Taipei 101.
      </div>
    </div>` :
    `<div class="frame" id="A">
      <img src="closing-bg.png">
      <div class="mask"></div>
      <div class="tag">Version A — replaces</div>
      <div class="hud-closing">Just like the man on Taipei 101.</div>
    </div>`
  );
</script>
</body></html>
