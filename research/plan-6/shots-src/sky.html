<!doctype html>
<html><head><meta charset="utf-8"><title>sky test</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<script src="../../../three.min.js"></script>
<script src="../../../asset/3d/assets-core.js"></script>
<script src="../../../asset/3d/assets-ximen-1980s.js"></script>
<script src="../../../asset/3d/assets-ximen-1990s.js"></script>
<script src="../../../asset/3d/assets-ximen-2000s.js"></script>
<script src="../../../asset/3d/assets-dadaocheng-1980s.js"></script>
<script src="../../../asset/3d/assets-dadaocheng-1990s.js"></script>
<script src="../../../asset/3d/assets-dadaocheng-2000s.js"></script>
<script>
// sky.html — sky option test, on the render-styles street rig (print.html without the print pass).
// ?set=ximen|dadao  ?sky=today|shown|bright  ?night=0..0.45 (0 = early chapter, 0.45 = today's tower-era value)
// The three PALETTE hexes below are copied from data.js so this stays a static test page.
(() => {
  const Q = new URLSearchParams(location.search);
  const SET = Q.get('set') || 'ximen';
  const SKY = Q.get('sky') || 'today';
  const NIGHT = parseFloat(Q.get('night') || '0');
  const W = innerWidth, H = innerHeight;

  const PALETTE = { ink: '#2b2f3a', haze: '#9fb6c9', lamp: '#ffb347', bone: '#f7f2e8', verm: '#d9483b', sky: '#8ecbff' };
  const C = k => new THREE.Color(PALETTE[k]);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(42, W / H, 0.5, 700);

  scene.add(new THREE.HemisphereLight(C('bone').lerp(C('sky'), 0.2), C('haze'), 0.65));
  const sun = new THREE.DirectionalLight(C('lamp'), 1.1); sun.position.set(18, 26, 12); scene.add(sun);

  // ── ground + road (same as print.html) ──
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshLambertMaterial({ color: 0xe8d6b4 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(13, 1200), new THREE.MeshLambertMaterial({ color: 0xdcc8a4 }));
  road.rotation.x = -Math.PI / 2; road.position.y = 0.02; scene.add(road);
  const kerbM = new THREE.MeshLambertMaterial({ color: 0x8a7a66 });
  [-6.6, 6.6].forEach(x => { const k = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 1200), kerbM); k.position.set(x, 0.12, 0); scene.add(k); });

  const trunkM = new THREE.MeshLambertMaterial({ color: 0x2a2320 }), leafM = new THREE.MeshLambertMaterial({ color: 0x6fae6a });
  function tree(x, z, s) {
    s = s || 1; const g = new THREE.Group();
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.28 * s, 4.2 * s, 6), trunkM); t.position.y = 2.1 * s; g.add(t);
    [[0, 5.2, 0, 2.2], [1.4, 4.4, 0.3, 1.5], [-1.3, 4.6, -0.2, 1.6], [0.3, 6.4, 0.5, 1.4], [-0.6, 4.0, 1.2, 1.2]].forEach(([dx, dy, dz, r]) => {
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, 1), leafM); m.position.set(dx * s, dy * s, dz * s); g.add(m);
    });
    g.position.set(x, 0, z); scene.add(g);
  }

  const REG = window.NOSTALGIA_ASSETS, Core = window.NostalgiaCore;
  const find = id => { for (const k in REG) { const a = REG[k].find(a => a.id === id); if (a) return a; } };
  const box = new THREE.Box3(), size = new THREE.Vector3();
  const build = id => { const a = find(id); if (!a) return null; return a.build(Core); };
  function placeSide(obj, side, zc) {
    obj.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
    obj.updateMatrixWorld(true); box.setFromObject(obj); box.getSize(size);
    obj.position.set(side * (7.2 + size.x / 2), 0, zc); scene.add(obj);
  }
  function street(ids, landmark, landmarkScale) {
    let zE = 12, zW = 8;
    ids.forEach((id, i) => {
      const obj = build(id); if (!obj) return;
      const side = i % 2 ? 1 : -1;
      obj.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; obj.updateMatrixWorld(true); box.setFromObject(obj); box.getSize(size);
      const depth = size.z; const zc = (side > 0 ? zE : zW) - depth / 2;
      placeSide(obj, side, zc);
      if (side > 0) zE -= depth + 2.5; else zW -= depth + 2.5;
    });
    if (landmark) { const o = build(landmark); if (o) { o.scale.setScalar(landmarkScale || 2.2); o.updateMatrixWorld(true); box.setFromObject(o); box.getSize(size); o.position.set(0, 0, Math.min(zE, zW) - 6 - size.z / 2); scene.add(o); } }
    for (let z = 10; z > -80; z -= 11) { tree(-9.5, z + 3, 1.15); tree(9.5, z, 1.05); }
  }

  if (SET === 'dadao') {
    street(['red-brick-arcade', 'baroque-gable-townhouse', 'dried-goods-shop', 'qipao-fabric-shop', 'nianhuo-stall', 'herbal-medicine-counter', 'new-year-market-stall', 'bolero-restaurant'], 'xiahai-temple', 2.4);
    cam.position.set(0, 3.2, 22); cam.lookAt(0, 5, -60);
  } else {
    street(['chunghwa-market', 'movie-billboard-wall', 'record-shop', 'tower-records', 'comic-rental-shop', 'internet-cafe', 'manga-rental', 'phone-shop-window'], 'red-house', 2.0);
    cam.position.set(0, 3.2, 22); cam.lookAt(0, 5, -60);
  }

  // ── SKY, three ways ────────────────────────────────────────────────────────
  // 'today' and 'bright' both use app.js's own gradient-dome + mountains + moon formula.
  // 'today' feeds the ?night value straight through, exactly as app.js does per era (0 at the
  // opening, 0.45 by the tower chapter — CJ never asked for this, it is what the code does now).
  // 'bright' pins night at 0 always: the fix, same dome, no creep toward ink, no moon.
  // 'shown' draws app.js's own canvas sky (the one PMREM'd into scene.environment and never put
  // on screen) directly as the background, unmodified — "option: show the drawn sky" from issue #8.
  const skyMat = new THREE.ShaderMaterial({
    uniforms: { top: { value: C('sky') }, horizon: { value: C('bone') } },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 top, horizon; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y, 0.0, 1.0); gl_FragColor = vec4(mix(horizon, top, pow(h, 0.55)), 1.0); }`,
    side: THREE.BackSide, depthWrite: false
  });
  const skyDome = new THREE.Mesh(new THREE.SphereGeometry(520, 24, 12), skyMat);

  const moon = new THREE.Mesh(new THREE.CircleGeometry(9, 24), new THREE.MeshBasicMaterial({ color: C('bone'), transparent: true, opacity: 0 }));

  const mountainMat = new THREE.MeshBasicMaterial({ color: C('haze') });
  const coneGeo = new THREE.ConeGeometry(1, 1, 7); coneGeo.translate(0, 0.5, 0);
  const mountains = new THREE.InstancedMesh(coneGeo, mountainMat, 26);
  (() => {
    const m = new THREE.Matrix4();
    for (let i = 0; i < 26; i++) {
      const a = -Math.PI * 0.05 + (i / 26) * Math.PI * 2.1, r = 430 + (i % 3) * 30;
      const h = 60 + ((i * 37) % 70), w = 140 + ((i * 53) % 120);
      m.makeScale(w, h, w).setPosition(Math.sin(a) * r, -6, -60 + Math.cos(a) * r);
      mountains.setMatrixAt(i, m);
    }
    mountains.instanceMatrix.needsUpdate = true;
  })();

  const skyEnv = (() => {                          // exact copy of app.js's canvas-drawn sky
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
    const g = cv.getContext('2d');
    const up = g.createLinearGradient(0, 0, 0, 128);
    up.addColorStop(0, '#8ec3f0'); up.addColorStop(0.72, '#bcd8ee'); up.addColorStop(1, PALETTE.bone);
    g.fillStyle = up; g.fillRect(0, 0, 512, 128);
    const dn = g.createLinearGradient(0, 128, 0, 256);
    dn.addColorStop(0, PALETTE.bone); dn.addColorStop(0.5, '#cfc6b4'); dn.addColorStop(1, '#8e8778');
    g.fillStyle = dn; g.fillRect(0, 128, 512, 128);
    const kd = sun.position.clone().normalize();
    const sx = (Math.atan2(kd.z, kd.x) / (2 * Math.PI) + 0.5) * 512, sy = (0.5 - Math.asin(kd.y) / Math.PI) * 256;
    const sung = g.createRadialGradient(sx, sy, 4, sx, sy, 78);
    sung.addColorStop(0, '#fff6e2'); sung.addColorStop(1, 'rgba(255,246,226,0)');
    g.fillStyle = sung; g.fillRect(sx - 90, 0, 180, 140);
    const t = new THREE.CanvasTexture(cv);
    t.mapping = THREE.EquirectangularReflectionMapping;
    return t;
  })();

  if (SKY === 'shown') {
    scene.background = skyEnv;                     // the never-shown env map, shown
  } else {
    scene.add(skyDome); scene.add(mountains); scene.add(moon);
    const night = SKY === 'bright' ? 0 : NIGHT;
    const skyC = C('bone').lerp(C('sky'), 0.35).lerp(C('lamp'), night * 0.7);
    skyMat.uniforms.horizon.value.copy(skyC);
    skyMat.uniforms.top.value.copy(C('sky')).lerp(C('ink'), 0.1 + night * 0.7);
    mountainMat.color.copy(C('haze')).lerp(C('sky'), 0.35).lerp(C('ink'), night * 0.4);
    moon.material.opacity = Math.max(0, night - 0.3) * 1.3;
    moon.position.set(160, 190, -330 - 60);
    moon.lookAt(0, 0, 0);
  }

  addEventListener('resize', () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); });
  function frame() { renderer.render(scene, cam); requestAnimationFrame(frame); }
  frame();
  window.__ready = true;
})();
</script>
</body></html>
