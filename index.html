<!doctype html>
<html lang="zh-Hant">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Scroll spacer. The canvas never scrolls; this page does, over it. -->
  <div class="scroll" aria-hidden="true">
    <section data-era="open"></section>
    <section data-era="flee"></section>
    <section data-era="tea"></section>

  <div id="labels" aria-hidden="true"></div>

  <div class="hud">
    <div class="hud-title">時代迷霧 <span>大稻埕</span></div>

    <div class="hud-year"><span class="hud-year-k">年</span><span id="year">1853</span></div>

  <script src="three.min.js"></script>
  <script src="data.js"></script>
