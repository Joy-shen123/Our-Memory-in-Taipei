<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Memory in Taipei</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Scroll spacer. The canvas never scrolls; this page does, over it. -->
  <div class="scroll" aria-hidden="true">
    <section data-era="open"></section>
    <section data-era="red"></section>
    <section data-era="dadao"></section>
    <section data-era="tower"></section>
    <section data-era="close"></section>
  </div>

  <div id="labels" aria-hidden="true"></div>

  <div class="hud">
    <div class="hud-title">Our Memory <span>in Taipei</span></div>
    <div class="hud-chapter">
      <div class="chap-col">
        <div class="chap-n"><span id="chapN">01</span><span class="chap-of">/03</span></div>
        <div class="chap-name" id="eraLabel"></div>
        <div class="chap-years" id="eraYears"></div>
      </div>
      <div class="chap-zh" id="eraZh"></div>
    </div>
    <div class="hud-word" id="word"><div class="word-big"></div><div class="word-sub"></div></div>
    <div class="hud-closing" id="closing"></div>
    <div class="hud-year"><span class="hud-year-k">YEAR</span><span id="year">1853</span></div>
  </div>

  <script src="three.min.js"></script>
  <script src="asset/3d/assets-core.js"></script>
  <script src="asset/3d/assets-ximen-1980s.js"></script>
  <script src="asset/3d/assets-ximen-1990s.js"></script>
  <script src="asset/3d/assets-ximen-2000s.js"></script>
  <script src="asset/3d/assets-dadaocheng-1980s.js"></script>
  <script src="asset/3d/assets-dadaocheng-1990s.js"></script>
  <script src="asset/3d/assets-dadaocheng-2000s.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="scene-red.js"></script>
  <script src="scene-dadao.js"></script>
  <script src="scene-tower.js"></script>
  <script src="music.js"></script>
</body>
</html>
